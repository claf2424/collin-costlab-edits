    if (f.sterility === "sterile" && good > STERILE_MAX_UNITS) return toast(`Sterile batches cannot exceed ${STERILE_MAX_UNITS} units.`);
    const at = nowIso();
    b.run.fill = { good, qa, locked: true, by: UI.actor, at };
    b.actualYield = good;
    runEvent(b, UI.actor, "fill_recorded", `Recorded yield: ${good} finished packages, ${qa} to testing/QA`, "fill", at);
    render(); toast("Yield recorded");
  },
  addMixStep: (fd) => {
    const f = by(S.formulas, R.id); const kind = fd.get("kind") || null;
    (f.mixSteps ||= []).push({ id: uid("ms"), text: fd.get("text"), kind, minutes: kind ? Math.max(1, Number(fd.get("minutes")) || 1) : null, detail: fd.get("detail") });
    closeModal(); toast("Step added to the formula");
  },
  verifyWeigh: (fd, el) => {
    const b = by(S.batches, el.dataset.id); const pid = fd.get("pharmacist"); const p = person(pid);
    if (p.role !== "pharmacist") return toast("Only a pharmacist can verify.");
    if (fd.get("pin") !== S.settings.pin) return toast("That PIN doesn't match. Try again.");
    const measurers = new Set(Object.values(b.run.measure || {}).map((m) => m.by));
    if (measurers.has(pid)) return toast("The verifying pharmacist can't be someone who measured. Ask another pharmacist.");
    const at = nowIso();
    Object.assign(b.run.steps.weigh, { status: "done", doneBy: pid, doneAt: at, verifiedBy: pid });
    runEvent(b, pid, "verified", `Verified ${stepTitle("weigh")}`, "weigh", at);
    UI.openSteps[b.id + "weigh"] = false; UI.openSteps[b.id + "mix"] = true;
    if (b.run.steps.mix.status === "todo") {
      const tech = b.run.steps.weigh.reviewBy || UI.actor;
      b.run.steps.mix = { status: "active", startedBy: tech, startedAt: at };
      runEvent(b, tech, "step_started", `Started ${stepTitle("mix")}`, "mix", at);
    }
    render(); toast(`Verified by ${p.name}`);
  },
  cancelRun: (fd, el) => {
    const b = by(S.batches, el.dataset.id); const at = nowIso();
    if (isRunning(b)) b.run.segments[b.run.segments.length - 1].end = at;
    b.run.cancelReason = fd.get("reason"); b.run.cancelledAt = at; b.status = "cancelled";
    runEvent(b, UI.actor, "batch_cancelled", `Cancelled batch: ${fd.get("reason")}`, null, at);
    log(`batch.cancelled · ${b.lot} by ${person(UI.actor).name}`);
    UI.modal = null; go("batch", b.id); toast("Batch cancelled");
  },
  addUnit: (fd) => { S.units.push({ id: uid("u"), name: fd.get("name"), abbr: fd.get("abbr") }); closeModal(); },
  invite: (fd) => { S.invites.push({ id: uid("i"), email: fd.get("email"), role: fd.get("role"), sent: TODAY }); closeModal(); toast("Invitation created"); },
  saveTol: (fd) => { S.settings.tolApi = Number(fd.get("tolApi")); S.settings.tolOther = Number(fd.get("tolOther")); S.settings.fillTol = Number(fd.get("fillTol")); render(); toast("Tolerances saved"); },
  saveOrg: (fd) => { S.org.name = fd.get("name"); render(); toast("Pharmacy name saved"); },
  addPlace: (fd, el) => { const name = fd.get("name").trim(); const list = S.places[el.dataset.k]; if (list.some((p) => p.name.toLowerCase() === name.toLowerCase())) return toast("That name is already on the list."); list.push({ id: uid("p"), name, archived: false }); render(); },
};

/* Work inside a section tile restarts a paused batch clock. Opening or closing a tile doesn't. */
function resumeFromTile(el, kind) {
  if (R.page !== "run" || kind === "toggleStep") return;
  const tile = el.closest("[data-tile]"); if (!tile) return;
  if (autoResume(by(S.batches, tile.dataset.tile), UI.actor)) toast("Batch clock restarted");
}
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.a];
  if (fn) { e.preventDefault(); resumeFromTile(el, el.dataset.a); fn(el); }
});
/* Live search: re-render on each keystroke and keep the cursor in the box. */
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-a-input]");
  if (!el || el.dataset.aInput !== "batchSearch") return;
  UI.batchQ = el.value; const pos = el.selectionStart; render();
  const box = document.getElementById("batch-search"); if (box) { box.focus(); try { box.setSelectionRange(pos, pos); } catch {} }
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-a-change]");
  if (el && changes[el.dataset.aChange]) { resumeFromTile(el, ""); changes[el.dataset.aChange](el); }
});
document.addEventListener("submit", (e) => {
  const el = e.target.closest("form[data-f]");
  if (!el) return;
  e.preventDefault();
  resumeFromTile(el, "");
  let fd; try { fd = new FormData(el, e.submitter || undefined); } catch { fd = new FormData(el); if (e.submitter?.name) fd.set(e.submitter.name, e.submitter.value); }
  forms[el.dataset.f] && forms[el.dataset.f](fd, el);
});
function pauseOnLeave() {
  if (R.page === "run") autoPause(by(S.batches, R.id), UI.actor, "Paused (left the screen)");
  saveState();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pauseOnLeave(); else if (R.page === "run") render(); });
window.addEventListener("pagehide", pauseOnLeave);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (UI.modal || UI.drawer)) { UI.modal = null; UI.drawer = false; render(); } });

setInterval(() => {
  const el = document.getElementById("run-clock");
  if (!el || R.page !== "run") return;
  if (Date.now() % 15000 < 1000) saveState();
  const b = by(S.batches, el.dataset.id);
  if (b && isRunning(b)) el.textContent = fmtDur(elapsedMs(b));
  if (!b?.run?.mix) return;
  document.querySelectorAll("[data-timer]").forEach((t) => {
    const [, sid] = t.dataset.timer.split("|");
    const x = b.mixSteps.find((y) => y.id === sid); const r = b.run.mix[sid];
    if (!x || !r?.timer?.start) return;
    const ms = timerMs(r.timer), target = x.minutes * 60000;
    t.textContent = fmtDur(ms).slice(ms >= 3600000 ? 0 : 3);
    const bar = document.querySelector(`[data-timerbar="${b.id}|${sid}"]`); if (bar) bar.style.width = Math.min(100, (ms / target) * 100) + "%";
    if (ms >= target && !r.notified) { r.notified = true; toast(`Step ${b.mixSteps.indexOf(x) + 1}: ${x.minutes} min reached`); render(); }
  });
}, 1000);
render();
</script>
