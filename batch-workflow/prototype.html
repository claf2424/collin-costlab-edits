function priceOf(S, comp, mfrName) {

    const comp = S.components.find((c) => c.id === l.compId);

          <div class="grid gap-4 sm:grid-cols-2">
            ${Field("Number of labels", `<input id="sl-n-${b.id}" name="copies" type="number" min="1" step="1" value="${Math.max(0, (sNeeded ?? 0) - sPrinted) || ""}" class="${inputClass} h-11 font-mono text-base" required>`, true, sNeeded != null ? `${sNeeded} ${sNeeded === 1 ? "unit" : "units"} ${q.sub ? "on the lab submission" : "pulled for testing/QA in Bottling"}${sPrinted ? `, ${sPrinted} printed so far` : ""}` : "")}
            ${Field("Printer", `<select id="sl-p-${b.id}" name="printerId" class="${inputClass} h-11">${S.printers.map((p) => opt(p.id, p.name, UI.lastPrinter || (f.sterility === "sterile" ? "lp2" : "lp1"))).join("")}</select>`, true)}
          </div>
          <div><button class="${secondaryButtonClass} h-11 px-5">${icon("printer", "h-4 w-4")}Print sample labels</button></div>
        </form>` : ""}
        <div class="mt-3 flex items-center justify-between gap-3 text-sm"><span class="font-semibold text-stone-800">Printed</span><span class="font-mono text-xs ${sNeeded != null && sPrinted < sNeeded ? "text-amber-700" : "text-stone-500"}">${sPrinted}${sNeeded != null ? ` of ${sNeeded}` : ""}</span></div>
        ${sJobs.length ? `<ul class="mt-2 grid gap-1.5">${sJobs.map((j) => `<li class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3 py-2 text-sm"><span class="flex min-w-0 items-center gap-2">${icon("printer", "h-3.5 w-3.5 flex-shrink-0 text-stone-400")}<span class="font-mono font-semibold text-stone-900">${j.copies}</span><span class="truncate text-stone-600">${esc(by(S.printers, j.printerId)?.name ?? "")}</span>${j.reprint ? Badge("Reprint", "amber", "px-1.5 py-0 text-[10px]") : ""}</span><span class="flex-shrink-0 text-xs text-stone-500">${esc(person(j.by).name.split(",")[0])} · ${ftime(j.at)}</span></li>`).join("")}</ul>` : '<p class="mt-2 rounded-lg border border-dashed border-stone-200 py-3 text-center text-sm text-stone-400">No sample labels printed yet.</p>'}
      </div>
    </div>` : "";
  /* Lab results: paperwork attached, then a pass/fail per test. Any failure fails the batch. */
  let resBlock = "";
  if (q.sub?.sentAt) {
    const docs = qaDocs(b), res = qaResults(b), outcome = labOutcome(b);
    const fmtSize = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
    const docRows = docs.map((d) => `<li class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3 py-2 text-sm">
        <span class="flex min-w-0 items-center gap-2.5">${d.dataUrl && d.type.startsWith("image/") ? `<img src="${d.dataUrl}" alt="" class="h-9 w-9 flex-shrink-0 rounded object-cover ring-1 ring-stone-200">` : `<span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded bg-red-50 text-red-600">${icon("file-text", "h-4 w-4")}</span>`}
          <span class="min-w-0"><span class="block truncate font-medium text-stone-900">${esc(d.name)}</span><span class="block text-xs text-stone-500">${fmtSize(d.size)} · ${esc(person(d.by).name)} · ${fts(d.at)}</span></span></span>
        ${editable ? `<button data-a="docRemove" data-id="${b.id}" data-doc="${d.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button>` : ""}</li>`).join("");
    const resRows = q.sub.tests.map((t) => { const r = res[t.lineId]; return `<tr class="${r ? (r.ok ? "bg-emerald-50/40" : "bg-red-50/60") : ""}">
        <td class="${tdClass} font-medium text-stone-900">${esc(t.name)}</td>
        <td class="${tdClass}">${r ? `${Badge(r.ok ? "Pass" : "Fail", r.ok ? "green" : "red", "", true)}<div class="mt-0.5 text-[11px] text-stone-500">${esc(person(r.by).name)} · ${fts(r.at)}</div>` : '<span class="text-stone-400">Awaiting result</span>'}</td>
        <td class="${tdClass} text-right">${editable ? r ? `<button data-a="resClear" data-id="${b.id}" data-line="${t.lineId}" class="${iconButtonClass}" title="Clear result">${icon("undo-2", "h-3.5 w-3.5")}</button>`
          : `<div class="inline-flex gap-1.5"><button data-a="resSet" data-id="${b.id}" data-line="${t.lineId}" data-ok="1" class="${smallButtonClass} border-emerald-300 text-emerald-700" ${docs.length ? "" : 'disabled title="Attach the lab paperwork first"'}>${icon("check", "h-3.5 w-3.5")}Pass</button><button data-a="resSet" data-id="${b.id}" data-line="${t.lineId}" data-ok="0" class="${smallButtonClass} border-red-200 text-red-600" ${docs.length ? "" : 'disabled title="Attach the lab paperwork first"'}>${icon("x", "h-3.5 w-3.5")}Fail</button></div>` : ""}</td></tr>`; }).join("");
    resBlock = `<h3 class="mb-1 mt-6 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-stone-500">Lab results ${outcome === "pass" ? Badge("All tests passed", "green", "normal-case tracking-normal", true) : outcome === "fail" ? Badge("Failed", "red", "normal-case tracking-normal", true) : Badge("Awaiting results", "amber", "normal-case tracking-normal", true)}</h3>
      <p class="mb-2 text-xs text-stone-500">When the lab's paperwork comes back, attach it here, then mark each test. If any test fails, the batch fails.</p>
      <div class="grid gap-2">${docRows || '<p class="rounded-lg border border-dashed border-stone-200 py-3 text-center text-sm text-stone-400">No lab paperwork attached yet.</p>'}</div>
      ${editable ? `<div class="mt-2 flex flex-wrap items-center gap-2">
          <label for="qa-upload-${b.id}" class="${secondaryButtonClass} cursor-pointer">${icon("paperclip")}Attach lab paperwork</label>
          <input id="qa-upload-${b.id}" type="file" multiple accept=".pdf,image/*,.doc,.docx" data-a-change="qaUpload" data-id="${b.id}" class="sr-only">
          <button data-a="docSample" data-id="${b.id}" class="text-xs font-medium text-brand hover:underline">Attach a sample results PDF (demo)</button></div>` : ""}
      <div class="-mx-4 mt-4 overflow-x-auto sm:-mx-5"><table class="${tableClass} min-w-[520px]"><thead class="${theadClass}"><tr><th class="${thClass}">Test</th><th class="${thClass}">Result</th><th class="${thClass} text-right"></th></tr></thead><tbody class="${tbodyClass}">${resRows}</tbody></table></div>
      ${outcome === "fail" ? `<div class="mt-4 flex flex-col gap-3 rounded-xl border border-red-200 bg-red-50/70 p-4 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex gap-3"><span class="mt-0.5 text-red-600">${icon("octagon-x", "h-5 w-5")}</span><div class="text-sm"><p class="font-semibold text-red-900">This batch failed third-party testing</p><p class="text-red-800/80">It can't be labeled or released. Reject it to close the record.</p></div></div>
          ${editable ? `<button data-a="rejectBatch" data-id="${b.id}" class="${buttonClass.replace("bg-brand", "bg-red-600").replace("hover:bg-brand-strong", "hover:bg-red-700")}">${icon("octagon-x")}Reject batch</button>` : ""}</div>` : ""}`;
  }
  const problems = qaProblems(b);
  const footer = st.status === "active" ? `<div class="mt-4 flex flex-wrap items-center justify-end gap-3 border-t border-stone-100 pt-4">
      ${problems.length ? `<span class="text-xs text-stone-500">${problems.map(esc).join(" ")}</span>` : ""}
      <button data-a="stepDone" data-id="${b.id}" data-k="qa" class="${buttonClass}" ${problems.length || locked ? "disabled" : ""}>${icon("circle-check")}Mark QA complete</button></div>` : "";
  return visBlock + tpBlock + sampleBlock + resBlock + footer;
}

/* ---------------------------- Labeling module ------------------------ */
/* A deterministic barcode-looking strip for the lot number (visual only). */
function barcodeSvg(text) {
  let x = 0; const bars = [];
  const seqBits = [...("*" + text + "*")].flatMap((ch) => { const c = ch.charCodeAt(0); return [1 + (c % 3), 1, 1 + ((c >> 2) % 2) * 2, 1, 1 + ((c >> 3) % 3), 2]; });
  seqBits.forEach((w, i) => { if (i % 2 === 0) bars.push(`<rect x="${x}" y="0" width="${w}" height="28" fill="#111"></rect>`); x += w; });
  return `<svg viewBox="0 0 ${x} 28" preserveAspectRatio="none" class="h-7 w-full" aria-hidden="true">${bars.join("")}</svg>`;
}
function labelPreview(b, testing = false) {
  const f = by(S.formulas, b.formulaId);
  const bud = b.snapshot?.budDate ?? (b.made && f.bud ? addDays(b.made, f.bud) : null);
  const client = by(S.clients, b.clientId)?.name;
  const sub = testing ? b.run?.qa?.sub : null;
  const lab = sub ? by(S.labs, sub.labId) : null;
  return `<div class="w-full max-w-[22rem] rounded-md border ${testing ? "border-2 border-[#b91c1c]" : "border-stone-300"} bg-white p-3 font-sans text-[#111] shadow-[0_1px_0_rgba(0,0,0,0.04),0_8px_24px_-12px_rgba(0,0,0,0.25)]" style="aspect-ratio: 2 / ${testing ? "1.3" : "1.15"}">
    <div class="flex h-full flex-col">
      ${testing ? `<div class="-mx-3 -mt-3 mb-1.5 bg-[#b91c1c] px-2 py-1 text-center text-[11px] font-black uppercase tracking-wide text-white">For testing only · Do not dispense</div>` : ""}
      <div class="flex items-start justify-between gap-2 border-b border-[#111] pb-1">
        <div class="min-w-0"><div class="truncate text-[10px] font-bold uppercase tracking-wide">${esc(S.org.name)}</div><div class="truncate text-[8px]">${esc(S.org.address)} · ${esc(S.org.phone)}</div></div>
        <div class="flex-shrink-0 text-right text-[8px] font-bold uppercase">${f.sterility === "sterile" ? "Sterile" : ""}<div>Rx only</div></div>
      </div>
      <div class="mt-1 text-[12px] font-bold leading-tight">${esc(f.name)}</div>
      <div class="text-[9px]">${fq(f.dispQty)} ${esc(f.dispUnit)} · ${esc(f.form)}${client && !testing ? ` · For: ${esc(client)}` : ""}</div>
      ${testing ? `<div class="mt-0.5 text-[8.5px] font-semibold leading-snug">QA sample${lab ? ` · ${esc(lab.name)}` : ""}${sub ? ` · ${esc(sub.id)}` : ""}</div><div class="text-[8px] leading-snug">${esc(f.labelText || "")}</div>`
        : `<div class="mt-0.5 line-clamp-2 text-[8.5px] leading-snug">${esc(f.labelText || "")}</div>`}
      <div class="mt-auto grid grid-cols-[1fr_auto] items-end gap-2">
        <div class="min-w-0">${barcodeSvg(b.lot)}<div class="mt-0.5 font-mono text-[8px] tracking-wider">${esc(b.lot)}</div></div>
        <div class="text-right font-mono text-[9px] leading-tight"><div>LOT <b>${esc(b.lot)}</b></div><div>MFD ${b.made ? fd(b.made) : "—"}</div><div>BUD <b>${bud ? fd(bud) : "—"}</b></div></div>
      </div>
      <div class="mt-1 border-t ${testing ? "border-[#b91c1c] font-bold text-[#b91c1c]" : "border-[#111]"} pt-0.5 text-[7.5px] uppercase tracking-wide">${testing ? "For testing only · Do not dispense" : "Compounded preparation"}</div>
    </div></div>`;
}
const labelJobs = (b) => ((b.run.labels ||= { jobs: [] }).jobs);
function labelModule(b, st, locked) {
  const editable = st.status === "active" && !locked;
  const jobs = labelJobs(b);
  const printed = jobs.reduce((s, j) => s + j.copies, 0);
  const packages = b.run.fill?.locked ? b.run.fill.good : null;
  const c = batchCost(S, b);
  const suggested = Math.max(0, (packages ?? c.finishedUnits) - printed);
  const short = packages != null && printed < packages;
  const qaDone = b.run.steps.qa.status === "done";
  const leq = by(S.labelEquip, b.run.labelEquipId);
  const equipBlock = `<div class="mb-6 flex flex-wrap items-end gap-3 rounded-lg border ${leq ? "border-stone-200/80" : "border-amber-200 bg-amber-50/50"} p-3">
      <div class="w-80 max-w-full">${Field("Labeled with", `<select id="label-equip" data-a-change="labelEquip" data-id="${b.id}" class="${inputClass}" ${editable ? "" : "disabled"}><option value="" ${leq ? "" : "selected"} disabled>Select labeling equipment</option>${S.labelEquip.map((e) => opt(e.id, e.name, b.run.labelEquipId || "")).join("")}</select>`, true)}</div>
      <p class="pb-2 text-xs text-stone-500">${leq ? `Set by ${esc(person(b.run.labelEquipBy).name)} · ${ftime(b.run.labelEquipAt)}` : "The applicator or method used to put the labels on. Required to finish Labeling."}</p></div>`;
  return `${equipBlock}<div class="grid gap-6 lg:grid-cols-[minmax(0,22rem)_1fr]">
    <div><h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-stone-500">Sample label</h3>
      <div class="rounded-xl bg-stone-100 p-4">${labelPreview(b)}</div>
      <p class="mt-2 text-xs text-stone-500">Pulled from the batch and its master formula. Edit the directions and storage line on the formula.</p></div>
    <div class="min-w-0">
      <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-stone-500">Print</h3>
      ${editable && !qaDone ? `<p class="rounded-lg border border-amber-200 bg-amber-50/60 p-3 text-sm text-amber-800">Labels can't be printed until QA is complete with the lab results attached and passing.</p>` : ""}
      ${editable && qaDone ? `<form data-f="printLabels" data-id="${b.id}" class="grid gap-4 rounded-lg border border-stone-200/80 p-4">
        <div class="grid gap-4 sm:grid-cols-2">
          ${Field("Number of labels", `<input id="lb-n" name="copies" type="number" min="1" step="1" value="${suggested || ""}" class="${inputClass} h-11 font-mono text-base" required>`, true, packages != null ? `${packages} finished packages from Bottling${printed ? `, ${printed} printed so far` : ""}` : `Bottling yield not recorded yet; estimated ${c.finishedUnits}`)}
          ${Field("Printer", `<select id="lb-p" name="printerId" class="${inputClass} h-11">${S.printers.map((p) => opt(p.id, p.name, UI.lastPrinter || (by(S.formulas, b.formulaId).sterility === "sterile" ? "lp2" : "lp1"))).join("")}</select>`, true)}
        </div>
        <div><button class="${buttonClass} h-11 px-5">${icon("printer", "h-4 w-4")}Print labels</button></div>
      </form>` : ""}
      <div class="mt-4">
        <div class="mb-2 flex items-center justify-between gap-3 text-sm"><span class="font-semibold text-stone-800">Print history</span><span class="font-mono text-xs ${short ? "text-amber-700" : "text-stone-500"}">${printed} printed${packages != null ? ` · ${packages} packages` : ""}</span></div>
        ${jobs.length ? `<ul class="grid gap-1.5">${jobs.map((j) => `<li class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3 py-2 text-sm"><span class="flex min-w-0 items-center gap-2">${icon("printer", "h-3.5 w-3.5 flex-shrink-0 text-stone-400")}<span class="font-mono font-semibold text-stone-900">${j.copies}</span><span class="truncate text-stone-600">${esc(by(S.printers, j.printerId)?.name ?? "")}</span>${j.reprint ? Badge("Reprint", "amber", "px-1.5 py-0 text-[10px]") : ""}</span><span class="flex-shrink-0 text-xs text-stone-500">${esc(person(j.by).name.split(",")[0])} · ${ftime(j.at)}</span></li>`).join("")}</ul>`
          : '<p class="rounded-lg border border-dashed border-stone-200 py-4 text-center text-sm text-stone-400">Nothing printed yet.</p>'}
        ${short && jobs.length ? `<p class="mt-2 text-xs text-amber-700">${packages - printed} fewer labels than finished packages.</p>` : ""}
      </div>
    </div></div>
    ${st.status === "active" ? `<div class="mt-4 flex flex-wrap items-center justify-end gap-3 border-t border-stone-100 pt-4">${!leq || !jobs.length ? `<span class="text-xs text-stone-500">${[!leq ? "Select the labeling equipment" : "", !jobs.length ? "print the labels" : ""].filter(Boolean).join(" and ")} to finish.</span>` : ""}<button data-a="stepDone" data-id="${b.id}" data-k="label" class="${buttonClass}" ${jobs.length && leq && !locked ? "" : "disabled"}>${icon("circle-check")}Mark Labeling complete</button></div>` : ""}`;
}

/* ---------------------------- Bottling module ------------------------ */
/* Packaging on the batch recipe, minus labels (those are counted in Labeling). */
const packagingLines = (S, b) => b.lines.filter((l) => { const c = by(S.components, l.compId); return c?.type === "packaging" && !/label/i.test(c.name); });
function fillModule(b, st, locked) {
  const f = by(S.formulas, b.formulaId);
  const c = batchCost(S, b);
  const editable = st.status === "active" && !locked;
  const r = (b.run.fill ||= { good: null, qa: null, locked: false });
  const pkg = packagingLines(S, b);
  const good = r.good, qa = r.qa;
  const hasGood = good != null && good !== "", hasQa = qa != null && qa !== "";
  const dispensable = hasGood && hasQa ? Number(good) - Number(qa) : null;
  const variance = hasGood ? Number(good) - c.finishedUnits : null;
  const problems = [];
  if (!b.run.fillEquipId) problems.push("Select the filling equipment.");
  if (!hasGood) problems.push("Enter the finished packages.");
  if (!hasQa) problems.push("Enter how many went to testing/QA (0 if none).");
  if (hasGood && hasQa && Number(qa) > Number(good)) problems.push("Testing/QA can't be more than the finished packages.");
  if (hasGood && f.sterility === "sterile" && Number(good) > STERILE_MAX_UNITS) problems.push(`Sterile batches cannot exceed ${STERILE_MAX_UNITS} units.`);
  const tile = (label, value, hint = "", tone = "") => `<div class="rounded-lg border border-stone-200/80 bg-white px-3.5 py-3"><div class="text-[11px] font-semibold uppercase tracking-wide text-stone-500">${label}</div><div class="mt-1 font-mono text-lg font-semibold ${tone || "text-stone-900"}">${value}</div>${hint ? `<div class="text-[11px] text-stone-400">${hint}</div>` : ""}</div>`;
  const pkgTable = `<div class="-mx-4 overflow-x-auto sm:-mx-5"><table class="${tableClass} min-w-[560px]"><thead class="${theadClass}"><tr><th class="${thClass}">Packaging</th><th class="${thClass}">Manufacturer · SKU</th><th class="${thClass} text-right">Expected qty</th></tr></thead><tbody class="${tbodyClass}">
    ${pkg.map((l) => { const comp = by(S.components, l.compId); const p = priceOf(S, comp, l.mfr); const m = comp.mfrs.find((x) => x.name === p.mfr); return `<tr><td class="${tdClass} font-medium text-stone-900">${esc(comp.name)}</td><td class="${tdClass} text-stone-600">${esc(p.mfr ?? "—")}${m?.ndc ? ` · <span class="font-mono">${esc(m.ndc)}</span>` : ""}</td><td class="${tdClass} text-right font-mono font-semibold text-stone-900">${fq(l.qty)} ${esc(comp.unit)}</td></tr>`; }).join("") || `<tr><td colspan="3" class="${tdClass} py-6 text-center text-stone-400">No packaging on this batch's recipe.</td></tr>`}
  </tbody></table></div>`;
  const inputs = r.locked
    ? `<div class="grid gap-3 sm:grid-cols-4">${tile("Expected", c.finishedUnits, `${fq(b.planned)} ${esc(f.unit)} ÷ ${fq(f.dispQty)} ${esc(f.dispUnit)}`)}${tile("Finished packages", good)}${tile("Testing / QA", qa, "Not dispensed")}${tile("Dispensable", dispensable, variance === 0 ? "On target" : `${variance > 0 ? "+" : ""}${variance} vs. expected`, "text-emerald-700")}</div>
      <div class="mt-3 flex flex-wrap items-center justify-between gap-3 text-xs text-stone-500"><span>${icon("check", "mr-1 inline h-3.5 w-3.5 align-[-2px] text-emerald-600")}Recorded by ${esc(person(r.by).name)} · ${fts(r.at)}</span>
        ${editable ? `<button data-a="fillEdit" data-id="${b.id}" class="${smallButtonClass}">${icon("pencil", "h-3.5 w-3.5")}Edit yield</button>` : ""}</div>`
    : `<form data-f="fillYield" data-id="${b.id}" class="grid gap-4">
        <div class="grid gap-3 sm:grid-cols-4">
          ${tile("Expected", c.finishedUnits, `${fq(b.planned)} ${esc(f.unit)} ÷ ${fq(f.dispQty)} ${esc(f.dispUnit)}`)}
          ${Field("Finished packages", `<input id="fill-good" data-a-change="fillField" data-id="${b.id}" data-k="good" name="good" type="number" min="0" step="1" value="${hasGood ? good : ""}" placeholder="e.g. ${c.finishedUnits}" class="${inputClass} h-11 font-mono text-base" ${editable ? "" : "disabled"} required>`, true, "Total filled and sealed")}
          ${Field("Sent for testing / QA", `<input id="fill-qa" data-a-change="fillField" data-id="${b.id}" data-k="qa" name="qa" type="number" min="0" step="1" value="${hasQa ? qa : ""}" placeholder="e.g. 2" class="${inputClass} h-11 font-mono text-base" ${editable ? "" : "disabled"} required>`, true, "Pulled, not dispensed")}
          ${tile("Dispensable", dispensable ?? "—", variance == null ? "Finished − testing/QA" : variance === 0 ? "On target" : `${variance > 0 ? "+" : ""}${variance} vs. expected`, dispensable == null ? "text-stone-400" : "text-stone-900")}
        </div>
        ${problems.length && (hasGood || hasQa || !b.run.fillEquipId) && (hasGood || hasQa) ? `<p class="text-xs text-red-600">${problems.map(esc).join(" ")}</p>` : ""}
        <div><button class="${secondaryButtonClass}" ${editable && !problems.length ? "" : "disabled"}>${icon("check")}Record yield</button></div>
      </form>`;
  const footer = st.status === "active"
    ? `<div class="flex flex-wrap items-center justify-end gap-3 border-t border-stone-100 pt-4"><button data-a="stepDone" data-id="${b.id}" data-k="fill" class="${buttonClass}" ${r.locked && !locked ? "" : 'disabled title="Record the yield first"'}>${icon("circle-check")}Mark Bottling complete</button></div>` : "";
  const eq = by(S.fillEquip, b.run.fillEquipId);
  const equipBlock = `<div class="flex flex-wrap items-end gap-3 rounded-lg border ${eq ? "border-stone-200/80" : "border-amber-200 bg-amber-50/50"} p-3">
      <div class="w-80 max-w-full">${Field("Filled with", `<select id="fill-equip" data-a-change="fillEquip" data-id="${b.id}" class="${inputClass}" ${editable && !r.locked ? "" : "disabled"}><option value="" ${eq ? "" : "selected"} disabled>Select filling equipment</option>${S.fillEquip.map((e) => opt(e.id, e.name, b.run.fillEquipId || "")).join("")}</select>`, true)}</div>
      <p class="pb-2 text-xs text-stone-500">${eq ? `Set by ${esc(person(b.run.fillEquipBy).name)} · ${ftime(b.run.fillEquipAt)}` : "The machine or method that did the fill. Required before recording the yield."}</p></div>`;
  return `<h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-stone-500">Packaging required</h3>${pkgTable}
    <h3 class="mb-2 mt-6 text-xs font-semibold uppercase tracking-wider text-stone-500">Filling equipment</h3>${equipBlock}
    <h3 class="mb-2 mt-6 text-xs font-semibold uppercase tracking-wider text-stone-500">In-process checks</h3>${fillChecksBlock(b, editable)}
    <h3 class="mb-2 mt-6 text-xs font-semibold uppercase tracking-wider text-stone-500">Yield</h3>${inputs}

              <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

          ${Section("Testing", `<div class="grid gap-3">${c.testLines.map((t) => `
            <div class="flex items-center justify-between gap-3 text-sm"><div class="min-w-0"><div class="font-medium text-stone-900">${esc(t.name)}</div><div class="mt-0.5 font-mono text-xs text-stone-500">${money(t.cost)} per ${t.freq} units</div></div>
            <button data-a="removeTest" data-scope="formula" data-id="${t.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button></div>`).join("")}
            <div><button data-a="addTest" data-scope="formula" class="${smallButtonClass}">${icon("plus", "h-3.5 w-3.5")}Add test</button></div></div>`)}
        </div>
      </div>
      ${Section("Mixing steps", `<ol class="grid gap-2">${(f.mixSteps || []).map((x, i, arr) => `
        <li class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3.5 py-2.5 text-sm">
          <div class="flex min-w-0 items-start gap-3"><span class="mt-0.5 font-mono text-xs text-stone-400">${i + 1}</span><div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2"><span class="font-medium text-stone-900">${esc(x.text)}</span>${x.kind ? Badge(`${kindLabel[x.kind]} · ${x.minutes} min`, x.kind === "heat" ? "amber" : x.kind === "rest" ? "neutral" : "blue", "px-1.5 py-0 text-[10px]") : ""}</div>
            ${x.detail ? `<div class="mt-0.5 text-xs text-stone-500">${esc(x.detail)}</div>` : ""}</div></div>
          <div class="flex flex-shrink-0 gap-1.5">

            <button data-a="removeMixStep" data-step="${x.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button></div>
        </li>`).join("") || '<li class="rounded-lg border border-dashed border-stone-200 py-4 text-center text-sm text-stone-400">No mixing steps yet.</li>'}</ol>
        <p class="mt-2 text-xs text-stone-400">New batches copy these steps. Batches already created keep the steps they started with.</p>`, "", `<button data-a="addMixStep" class="${smallButtonClass}">${icon("plus", "h-3.5 w-3.5")}Add step</button>`)}
      ${Section("QA release checks", `<form data-f="saveAppearance" class="mb-3 flex flex-wrap items-end gap-2"><div class="w-72">${Field("Expected appearance / color", `<input id="f-app" name="appearance" class="${inputClass}" value="${esc(f.appearance || "")}" placeholder="e.g. clear, pale yellow">`, false, "Fills {appearance} in the inspection items")}</div><button class="${smallButtonClass} mb-5 h-9">Save</button></form>

        <ul class="grid gap-1.5">${(f.visual || []).map((v) => `<li class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3.5 py-2 text-sm"><span class="text-stone-800">${esc(v.text.replace("{appearance}", f.appearance || "{appearance}"))}</span><button data-a="removeVisual" data-v="${v.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button></li>`).join("") || '<li class="rounded-lg border border-dashed border-stone-200 py-3 text-center text-sm text-stone-400">None yet.</li>'}</ul>
        <form data-f="addVisual" class="mt-2 flex gap-2"><input id="f-vis" name="text" class="${inputClass}" placeholder="e.g. All product appears {appearance} in color" required><button class="${smallButtonClass} h-9">Add</button></form>
        <p class="mt-3 text-xs text-stone-400">Third-party tests come from the Testing list above. Both run in the QA step.</p>`)}
      ${Section("Cost breakdown", costBreakdown(groups, c, fu))}

function costBreakdown(groups, c, fu, unitWord = "saleable unit") {
  return `<div class="grid gap-4 lg:grid-cols-[minmax(0,320px)_1fr]">

        <div class="mt-1 flex items-baseline justify-between gap-3 border-t border-stone-200 pt-2"><dt class="font-medium text-stone-700">Materials</dt><dd class="font-mono font-semibold text-stone-900">${money(c.material)}</dd></div></dl>

        <tr><td class="py-3 text-left font-medium text-stone-700">Per ${unitWord}</td><td class="px-3 py-3 font-mono text-stone-600">${money(c.material / fu)}</td><td class="px-3 py-3 font-mono text-stone-600">${money(c.labor / fu)}</td><td class="px-3 py-3 font-mono text-stone-600">${money(c.testing / fu)}</td><td class="px-3 py-3 font-mono font-semibold text-stone-900">${money(c.total / fu)}</td></tr>

}
const lineById = (lines, id) => lines.find((l) => l.id === id) || {};

/* ------ Batches ------ */
const placeText = (s) => [s.location, s.room, s.hood].filter(Boolean).join(" · ");
pages.batches = () => {
  const mine = S.batches.filter((b) => b.slot && b.status !== "complete" && b.slot.people.includes(S.me.id));
  const myRows = mine.map((b) => `<tr class="${trClass}">
    <td class="${tdClass} whitespace-nowrap font-mono font-semibold text-stone-900"><button data-a="nav" data-to="batch" data-id="${b.id}" class="hover:text-brand hover:underline">${esc(b.lot)}</button></td>
    <td class="${tdClass} min-w-[8rem] text-stone-700">${esc(by(S.formulas, b.formulaId).name)}</td>
    <td class="${tdClass} text-stone-700">${esc(by(S.clients, b.clientId)?.name ?? "—")}</td>
    <td class="${tdClass}">${StatusBadge(b.status, "px-2 py-0 text-[11px]")}</td>
    <td class="${tdClass} whitespace-nowrap text-stone-700">${fd(b.slot.date)} · ${esc(b.slot.start)}</td>
    <td class="${tdClass} whitespace-nowrap text-stone-600">${esc(placeText(b.slot))}</td>
    <td class="${tdClass} whitespace-nowrap text-right"><button data-a="nav" data-to="batch" data-id="${b.id}" class="${iconButtonClass}" title="View">${icon("eye", "h-3.5 w-3.5")}</button></td></tr>`).join("");
  /* Search by lot # (also formula or client) and filter by status. */
  const FILTERS = [["all", "All"], ["draft", "Draft"], ["scheduled", "Scheduled"], ["in_progress", "In progress"], ["quarantine", "Quarantined"], ["complete", "Complete"], ["failed", "Failed"], ["cancelled", "Cancelled"]];
  const term = (UI.batchQ || "").trim().toLowerCase();
  const matches = (b) => !term || [b.lot, by(S.formulas, b.formulaId)?.name, by(S.clients, b.clientId)?.name].some((v) => (v || "").toLowerCase().includes(term));
  const searched = S.batches.filter(matches);
  const filt = UI.batchStatus || "all";
  const list = searched.filter((b) => filt === "all" || b.status === filt);
  const counts = Object.fromEntries(FILTERS.map(([k]) => [k, k === "all" ? searched.length : searched.filter((b) => b.status === k).length]));
  const filterBar = `<div class="mb-5 flex flex-col gap-3 rounded-xl border border-stone-200/80 bg-white p-3 shadow-sm sm:p-4">
      <div class="relative">${icon("search", "pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-stone-400")}
        <input id="batch-search" data-a-input="batchSearch" type="search" value="${esc(UI.batchQ || "")}" placeholder="Search by lot #, formula or client" autocomplete="off" class="${inputClass} h-11 pl-9 text-base sm:text-sm">
      </div>
      <div class="flex flex-wrap gap-1.5" role="group" aria-label="Filter by status">${FILTERS.filter(([k]) => k === "all" || counts[k] > 0 || filt === k).map(([k, l]) => { const a = filt === k; return `<button data-a="batchFilter" data-k="${k}" aria-pressed="${a}" class="inline-flex h-8 items-center gap-1.5 rounded-full px-3 text-xs font-semibold transition-colors ${a ? "bg-brand text-white shadow-sm" : "border border-stone-200 bg-white text-stone-600 hover:bg-stone-50 hover:text-stone-900"}">${k !== "all" ? `<span class="h-1.5 w-1.5 rounded-full ${a ? "bg-white" : { draft: "bg-stone-400", scheduled: "bg-blue-500", in_progress: "bg-amber-500", quarantine: "bg-violet-500", complete: "bg-emerald-500", failed: "bg-red-500", cancelled: "bg-red-400" }[k]}"></span>` : ""}${l}${k === "complete" ? "" : `<span class="rounded px-1 font-mono text-[11px] ${a ? "bg-white/20" : "bg-stone-100 text-stone-500"}">${counts[k]}</span>`}</button>`; }).join("")}</div>
    </div>`;
  const filtered = term || filt !== "all";
  const rows = list.map((b) => {
    const f = by(S.formulas, b.formulaId);
    const c = batchCost(S, b), u = unitCost(b, c);
    return `<tr class="${trClass}">
      <td class="${tdClass} whitespace-nowrap font-mono font-semibold text-stone-900"><button data-a="nav" data-to="batch" data-id="${b.id}" class="hover:text-brand hover:underline">${esc(b.lot)}</button></td>
      <td class="${tdClass} min-w-[6.5rem] text-stone-700">${esc(b.snapshot?.formulaName ?? f.name)}</td>
      <td class="${tdClass} min-w-[6rem] ${b.clientId ? "text-stone-700" : "text-stone-400"}">${esc(by(S.clients, b.clientId)?.name ?? "—")}</td>
      <td class="${tdClass}">${StatusBadge(b.status, "px-2 py-0 text-[11px]")}</td>
      <td class="${tdClass} whitespace-nowrap text-stone-600">${fd(b.made)}</td>
      <td class="${tdClass} whitespace-nowrap font-mono text-stone-600">${fq(b.planned)} ${esc(f.unit)}</td>
      <td class="${tdClass} whitespace-nowrap font-mono ${b.actualYield == null ? "text-stone-400" : "text-stone-700"}">${b.actualYield == null ? "—" : fq(b.actualYield) + " units"}</td>
      <td class="${tdClass} whitespace-nowrap font-mono"><div class="font-semibold text-stone-900">${money(c.total)}${c.source === "live" ? '<span class="ml-1.5 font-sans text-[10px] font-medium uppercase tracking-wide text-amber-600" title="Provisional: current library prices">live</span>' : ""}</div>
        <div class="text-xs text-stone-500">${u.kind === "unavailable" ? '<span class="text-stone-400">— / unit</span>' : `${money(u.cents)} / unit${u.kind === "estimated" ? '<span class="ml-1 font-sans text-[10px] font-medium uppercase tracking-wide text-stone-400" title="Estimated from planned units">est.</span>' : ""}`}</div></td>
      <td class="${tdClass} whitespace-nowrap text-right"><div class="flex items-center justify-end gap-1.5">
        <button data-a="dupBatch" data-id="${b.id}" class="${iconButtonClass}" title="Duplicate">${icon("copy", "h-3.5 w-3.5")}</button>
        <button data-a="nav" data-to="batch" data-id="${b.id}" class="${iconButtonClass}" title="View">${icon("eye", "h-3.5 w-3.5")}</button></div></td></tr>`;
  }).join("");
  return `${PageHeader("Production Batches", "Plan and track production batches from master formulas with scaled material, labor, packaging, testing, yield, and BUD costing.",
      `<button data-a="nav" data-to="batchreport" class="${secondaryButtonClass}">${icon("chart-column")}Batch report</button><button data-a="newBatch" class="${buttonClass}">${icon("plus")}New batch</button>`)}
    ${filterBar}
    ${(() => { const qs = S.batches.filter((x) => x.status === "quarantine"); return qs.length && !filtered ? TableCard("Quarantined - out for testing", `<table class="${tableClass} min-w-[860px]"><thead class="${theadClass}"><tr><th class="${thClass}">Lot #</th><th class="${thClass}">Formula</th><th class="${thClass}">Lab</th><th class="${thClass}">Tests</th><th class="${thClass}">Sent</th><th class="${thClass}">Waiting</th><th class="${thClass}">Results</th><th class="${thClass} text-right">Actions</th></tr></thead><tbody class="${tbodyClass}">
      ${qs.map((x) => { const q = qaState(x); const res = qaResults(x); const got = q.sub.tests.filter((t) => res[t.lineId]).length; return `<tr class="${trClass}">
        <td class="${tdClass} whitespace-nowrap font-mono font-semibold text-stone-900"><button data-a="nav" data-to="batch" data-id="${x.id}" class="hover:text-brand hover:underline">${esc(x.lot)}</button></td>
        <td class="${tdClass} min-w-[8rem] text-stone-700">${esc(by(S.formulas, x.formulaId).name)}</td>
        <td class="${tdClass} text-stone-700">${esc(by(S.labs, q.sub.labId).name)}</td>
        <td class="${tdClass} text-stone-600">${esc(q.sub.tests.map((t) => t.name.split(" (")[0]).join(", "))}</td>
        <td class="${tdClass} whitespace-nowrap text-stone-600">${fts(q.sub.sentAt)}<div class="font-mono text-[11px] text-stone-400">${esc(q.sub.tracking)}</div></td>
        <td class="${tdClass} whitespace-nowrap font-mono text-stone-700">${daysSince(x.run.quarantinedAt)} days</td>
        <td class="${tdClass}">${Badge(`${got} of ${q.sub.tests.length} in`, got ? "blue" : "neutral", "px-2 py-0 text-[11px]")}${qaDocs(x).length ? `<div class="mt-0.5 text-[11px] text-stone-500">${qaDocs(x).length} ${qaDocs(x).length === 1 ? "file" : "files"} attached</div>` : ""}</td>
        <td class="${tdClass} whitespace-nowrap text-right"><button data-a="nav" data-to="run" data-id="${x.id}" class="${smallButtonClass}">${icon("paperclip", "h-3.5 w-3.5")}Enter results</button></td></tr>`; }).join("")}
      </tbody></table>`, `<span class="text-xs text-stone-500">${qs.length} held</span>`, "", "mb-6") : ""; })()}
    ${filtered ? "" : TableCard("My batches", mine.length ? `<table class="${tableClass} min-w-[760px]"><thead class="${theadClass}"><tr><th class="${thClass}">Lot #</th><th class="${thClass}">Formula</th><th class="${thClass}">Client</th><th class="${thClass}">Status</th><th class="${thClass}">When</th><th class="${thClass}">Where</th><th class="${thClass} text-right">Actions</th></tr></thead><tbody class="${tbodyClass}">${myRows}</tbody></table>`
      : '<p class="px-5 py-3.5 text-sm text-stone-500">Nothing assigned to you on the schedule.</p>', `<span class="text-xs text-stone-500">${mine.length} open ${mine.length === 1 ? "batch" : "batches"}</span>`, "", "mb-6")}
    ${TableCard(filtered ? `Batch records · ${list.length} ${list.length === 1 ? "match" : "matches"}` : "Batch records", !list.length ? Empty("search", "No batches match", term ? `Nothing found for "${UI.batchQ.trim()}"${filt !== "all" ? " with this status" : ""}.` : "No batches with this status.", `<button data-a="batchClear" class="${secondaryButtonClass}">Clear search and filter</button>`) : `<table class="${tableClass} min-w-[840px]"><thead class="${theadClass}"><tr><th class="${thClass}">Lot #</th><th class="${thClass}">Formula</th><th class="${thClass}">Client</th><th class="${thClass}">Status</th><th class="${thClass}">Date made</th><th class="${thClass}">Planned qty</th><th class="${thClass}">Actual yield</th><th class="${thClass}">Cost</th><th class="${thClass} text-right">Actions</th></tr></thead><tbody class="${tbodyClass}">${rows}</tbody></table>`,
      "", `<div class="flex flex-wrap items-center justify-between gap-3 border-t border-stone-100 px-4 py-3"><p class="text-xs text-stone-500"><span class="font-medium tabular-nums text-stone-700">${list.length}</span> of <span class="font-medium tabular-nums text-stone-700">${S.batches.length}</span> batches</p>${filtered ? `<button data-a="batchClear" class="${smallButtonClass}">Clear</button>` : ""}</div>`)}`;
};

pages.batch = () => {
  const b = by(S.batches, R.id);
  if (!b) return pages.batches();
  const f = by(S.formulas, b.formulaId);
  const done = isClosed(b);
  const snap = b.snapshot || { formulaName: f.name, sterility: f.sterility, budDate: null, clientName: by(S.clients, b.clientId)?.name ?? null, yieldUnit: f.unit, form: f.form, dispQty: f.dispQty, dispUnit: f.dispUnit, completedOn: b.run?.cancelledAt?.slice(0, 10) };
  const c = batchCost(S, b);
  const u = unitCost(b, c);
  const ster = done ? snap.sterility : f.sterility;
  const budDate = done ? snap.budDate : b.made && f.bud ? addDays(b.made, f.bud) : null;
  const problems = done ? [] : batchProblems(S, b);
  const groups = lineGroups(c.lineCosts);
  const loss = b.actualYield != null && c.finishedUnits ? b.actualYield - c.finishedUnits : null;
  const lineRow = (l, g) => {
    const comp = by(S.components, l.compId);
    const choosable = !done && comp && comp.mfrs.length > 1;
    return `<div class="flex items-center justify-between gap-3 rounded-lg border border-stone-200/80 px-3.5 py-3 text-sm">
      <div class="min-w-0"><div class="font-medium text-stone-900">${esc(l.name)}</div>
        <div class="mt-0.5 flex flex-wrap items-center gap-x-2 text-xs text-stone-500"><span>${esc(g.title)}${l.mfr && !choosable ? " · " + esc(l.mfr) : ""} · ${money(l.unitCost)}/${esc(l.unit)}${done ? " · v1" : ""}</span>
        ${choosable ? `<select data-a-change="lineMfr" data-scope="batch" data-id="${l.id}" class="h-7 rounded-md border border-stone-200 bg-white pl-2 text-xs text-stone-700">${opt("", `Preferred (${comp.mfrs.find((m) => m.preferred).name})`, lineById(b.lines, l.id).mfr || "")}${comp.mfrs.map((m) => opt(m.name, m.name, lineById(b.lines, l.id).mfr || "")).join("")}</select>` : ""}</div></div>
      <div class="flex flex-shrink-0 items-center gap-2 text-right">
        ${done ? `<div><div class="font-mono text-stone-900">${fq(l.qty)} ${esc(l.unit)}</div><div class="font-mono text-xs text-stone-500">${money(l.ext)}</div></div>` : `
          <input data-a-change="lineQty" data-id="${l.id}" aria-label="Quantity of ${esc(l.name)}" class="h-8 w-24 rounded-lg border border-stone-300 bg-white px-2 text-right font-mono text-sm shadow-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20" type="number" step="0.0001" min="0" value="${l.qty}">
          <span class="w-6 text-left text-xs text-stone-500">${esc(l.unit)}</span>
          <span class="w-20 font-mono text-xs text-stone-500">${money(l.ext)}</span>
          <button data-a="removeLine" data-scope="batch" data-id="${l.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button>`}
      </div></div>`;
  };
  const statusActions = done || b.status === "cancelled"
    ? `<button data-a="nav" data-to="record" data-id="${b.id}" class="${secondaryButtonClass}">${icon("file-text")}Compounding record</button>`
    : `<div class="flex flex-wrap items-center gap-2 sm:flex-shrink-0">
      ${["in_progress", "quarantine"].includes(b.status) ? `<button data-a="nav" data-to="run" data-id="${b.id}" class="${buttonClass}">${icon("play")}Open workflow</button>`
        : `<button data-a="startBatch" data-id="${b.id}" class="${buttonClass}">${icon("play")}Start Batch</button>`}</div>`;
  return `${BackLink("batches", "Back to batches")}
    ${PageHeader(done ? snap.formulaName : f.name, `Lot # ${b.lot}`, `
      <button data-a="dupBatch" data-id="${b.id}" class="${secondaryButtonClass}">${icon("copy")}Duplicate</button>
      <button data-a="toast" data-msg="PDF export opens the batch record print view in the live app." class="${secondaryButtonClass}">${icon("file-down")}Export PDF</button>
      ${done ? Badge(icon("lock", "h-3.5 w-3.5") + "Locked", "green") : `<button data-a="deleteBatch" data-id="${b.id}" class="inline-flex h-9 items-center justify-center gap-2 rounded-lg border border-red-200 bg-white px-4 text-sm font-semibold text-red-600 shadow-sm transition hover:bg-red-50">${icon("trash-2")}Delete</button>
      <button type="submit" form="batch-details-form" class="${buttonClass}">Save details</button>`}`)}
    <div class="mb-6 flex flex-col gap-3 rounded-xl border border-stone-200/80 bg-white p-4 shadow-sm sm:flex-row sm:items-start sm:justify-between">
      <div class="flex flex-wrap items-center gap-3"><span class="text-xs font-semibold uppercase tracking-wider text-stone-500">Status</span>${StatusBadge(b.status)}${SterilityBadge(ster, done)}
        ${b.slot ? `<button data-a="gotoWeek" data-date="${b.slot.date}" class="inline-flex items-center gap-1.5 text-sm text-stone-600 transition-colors hover:text-stone-900" title="Open on the schedule">${icon("calendar-days", "h-4 w-4 text-stone-400")}${fd(b.slot.date)}, ${esc(b.slot.start)} – ${esc(b.slot.end)}${b.slot.hood ? " · " + esc(b.slot.hood) : ""}</button>` : ""}
        ${done ? `<span class="text-sm text-stone-500">Record locked on ${fd(snap.completedOn)}</span>` : ""}</div>
      ${statusActions}
    </div>
    ${b.status === "cancelled" ? Notice("stone", "This batch was cancelled", esc(b.run?.cancelReason || "No reason recorded.")) : ""}
    ${b.status === "failed" ? Notice("stone", "This batch failed QA", esc(b.run?.cancelReason || "Third-party testing failed.")) : ""}
    ${!done && problems.length ? Notice("stone", "Before this batch can be completed", `<ul class="mt-1 list-disc space-y-0.5 pl-4">${problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`) : ""}
    <div class="mb-6">${Section("Batch details", done ? `
      <dl class="grid gap-x-6 gap-y-4 text-sm sm:grid-cols-2 lg:grid-cols-4">
        ${[["Lot #", `<span class="font-mono">${esc(b.lot)}</span>`], ["Client", esc(snap.clientName ?? "—")], ["Batch size (planned)", `<span class="font-mono">${fq(b.planned)} ${esc(snap.yieldUnit)}</span>`], ["Manufactured", fd(b.made)], ["Dispensing", `${esc(snap.form)} · ${fq(snap.dispQty)} ${esc(snap.dispUnit)}`], ["Sterility", SterilityBadge(snap.sterility, true)], ["Beyond use date", fd(snap.budDate)], ["Actual yield", `<span class="font-mono">${fq(b.actualYield)} units</span>`]]
          .map(([k, v]) => `<div><dt class="text-xs font-medium uppercase tracking-wide text-stone-500">${k}</dt><dd class="mt-1 text-stone-900">${v}</dd></div>`).join("")}</dl>` : `
      <form id="batch-details-form" data-f="saveBatch" data-id="${b.id}" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        ${Field("Lot #", `<input id="b-lot" class="${inputClass} font-mono" name="lot" value="${esc(b.lot)}" required>`, true)}
        ${Field("Client", `<select id="b-client" class="${inputClass}" name="clientId">${opt("", "No client", b.clientId || "")}${S.clients.map((k) => opt(k.id, k.name, b.clientId || "")).join("")}</select>`)}
        ${Field(`Batch size (${f.unit})`, `<input id="b-planned" class="${inputClass}" name="planned" type="number" min="0.0001" step="0.0001" value="${b.planned}" required>`, true, "Changing it rescales the recipe.")}
        ${Field("Manufactured date", `<input id="b-made" class="${inputClass}" name="made" type="date" value="${b.made || ""}">`)}
      </form>`)}</div>
    <div class="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6">
      ${StatTile("Batch size", `${fq(b.planned)} ${f.unit}`, "Planned bulk quantity")}
      ${StatTile("Compounded on", fd(b.made), "", b.made ? "default" : "muted")}
      ${StatTile("Beyond use date", budDate ? fd(budDate) : "—", done ? "Assigned at completion" : f.bud ? `Projected: made + ${f.bud} days` : "No BUD on the MFR", budDate ? "default" : "muted")}
      ${StatTile("Est. finished", `${c.finishedUnits} units`, `Batch size ÷ ${fq(f.dispQty)} ${f.dispUnit} per unit`)}
      ${StatTile("Actual yield", b.actualYield != null ? `${fq(b.actualYield)} units` : "—", loss != null ? `${loss === 0 ? "No loss" : loss < 0 ? `${Math.abs(loss)} short` : `${loss} over`} vs. ${c.finishedUnits} estimated` : "Not recorded", b.actualYield == null ? "muted" : "default")}
      ${StatTile(u.kind === "estimated" ? "Est. cost / unit" : "Cost / unit", u.kind === "unavailable" ? "—" : money(u.cents), u.kind === "actual" ? `Actual · ${money(c.total)} ÷ ${u.units} units` : u.kind === "estimated" ? `Estimated · planned ${u.units} units; actual cost needs the actual yield` : "")}
    </div>
    <div class="grid gap-4 xl:grid-cols-[1fr_360px]">
      ${Section(done ? "Components (locked)" : "Components", `<div class="grid gap-6">${groups.map((g) => `
        <div><h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-stone-500">${esc(g.title)}</h3>
          <div class="grid gap-2">${g.items.map((l) => lineRow(l, g)).join("") || '<div class="rounded-lg border border-dashed border-stone-200 py-4 text-center text-sm text-stone-400">None on this batch.</div>'}</div>
          ${done ? "" : `<div class="mt-2"><button data-a="addLine" data-scope="batch" data-type="${g.id}" class="${smallButtonClass}">${icon("plus", "h-3.5 w-3.5")}Add ${esc(g.title)}</button></div>`}</div>`).join("")}</div>`, "min-w-0")}
      <div class="grid content-start gap-4">
        ${done ? "" : b.run ? Section("Actual yield", `<p class="text-sm text-stone-600">${b.run.fill?.locked ? `<span class="font-mono font-semibold text-stone-900">${b.run.fill.good}</span> finished packages, <span class="font-mono font-semibold text-stone-900">${b.run.fill.qa}</span> to testing/QA.` : "Recorded in the Bottling step of the workflow."}</p><button data-a="nav" data-to="run" data-id="${b.id}" class="${smallButtonClass} mt-3">${icon("play", "h-3.5 w-3.5")}Open workflow</button>`) : Section("Actual yield", `<form data-f="saveYield" data-id="${b.id}" class="grid gap-3">
          ${Field("Finished units made", `<input id="b-yield" class="${inputClass}" name="yield" type="number" min="0" step="1" value="${b.actualYield ?? ""}" placeholder="e.g. ${c.finishedUnits}">`, false, ster === "sterile" ? `Count of finished ${f.form.toLowerCase()}s, not a bulk amount. Sterile batches are limited to ${STERILE_MAX_UNITS}.` : `Count of finished units, not a bulk amount.`)}
          <button class="${secondaryButtonClass}">Save yield</button></form>`)}
        ${Section("Labor", `<div class="grid gap-3 text-sm">${c.laborLines.map((l) => `
          <div class="flex items-center justify-between gap-3"><div class="min-w-0"><div class="font-medium text-stone-900">${esc(l.name)}</div><div class="mt-0.5 font-mono text-xs text-stone-500">${fq(l.qty)} ${l.basis === "unit" ? "units" : "hrs"} @ ${money(l.rate)}/${l.basis === "unit" ? "unit" : "hr"} · ${money(l.ext)}</div></div>
          ${done ? "" : `<button data-a="removeLabor" data-scope="batch" data-id="${l.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button>`}</div>`).join("") || '<span class="text-stone-400">No labor on this batch.</span>'}
          ${done ? "" : `<div><button data-a="addLabor" data-scope="batch" class="${smallButtonClass}">${icon("plus", "h-3.5 w-3.5")}Add labor</button></div>`}</div>`)}
        ${Section("Testing", `<div class="grid gap-3 text-sm">${c.testLines.map((t) => `
          <div class="flex items-center justify-between gap-3"><div class="min-w-0"><div class="font-medium text-stone-900">${esc(t.name)}</div><div class="mt-0.5 font-mono text-xs text-stone-500">${money(t.cost)} per ${t.freq} units · ${money(t.ext)}</div></div>
          ${done ? "" : `<button data-a="removeTest" data-scope="batch" data-id="${t.id}" class="${dangerIconButtonClass}" title="Remove">${icon("trash-2", "h-3.5 w-3.5")}</button>`}</div>`).join("") || '<span class="text-stone-400">No testing on this batch.</span>'}
          ${done ? "" : `<div><button data-a="addTest" data-scope="batch" class="${smallButtonClass}">${icon("plus", "h-3.5 w-3.5")}Add test</button></div>`}</div>`)}
      </div>
    </div>
    <div class="mt-4">${Section("Cost breakdown", costBreakdown(groups, c, b.actualYield || c.finishedUnits || 1, b.actualYield ? "finished unit (actual)" : "finished unit (est.)"), "", c.source === "live" ? Badge("Provisional · current library prices", "amber") : Badge(icon("lock", "h-3 w-3") + "Frozen at completion", "green"))}</div>`;
};

/* ------ Batch workflow (run screen) ------ */
pages.run = () => {
  const b = by(S.batches, R.id);
  if (!b || !b.run) return pages.batch();
  const f = by(S.formulas, b.formulaId);
  const running = isRunning(b), started = runStarted(b);
  const closed = isClosed(b);
  const problems = runProblems(S, b);
  const doneCount = STEPS.filter((s) => b.run.steps[s.key].status === "done").length;
  const firstEv = b.run.events.find((e) => e.type === "batch_started");
  const c = batchCost(S, b);
  const locked = closed;
  const tile = (s, i) => {
    const st = b.run.steps[s.key];
    const isDone = st.status === "done";
    const open = UI.openSteps[b.id + s.key] ?? (st.status === "active" || st.status === "review");
    const badge = isDone ? "" : st.status === "review" ? Badge("Awaiting verification", "violet", "", true) : st.status === "active" ? Badge("In progress", "amber", "", true) : Badge("Not started", "neutral", "", true);
    const meta = isDone
      ? `${st.verifiedBy ? "Verified by " : ""}${esc(person(st.doneBy).name)} · ${fts(st.doneAt)} · ${fmtDurShort(tsDate(st.doneAt) - tsDate(st.startedAt))}`
      : st.status === "review" ? `Ready for review · ${esc(person(st.reviewBy).name)} · ${fts(st.reviewAt)}`
      : st.status === "active" ? `Started by ${esc(person(st.startedBy).name)} · ${fts(st.startedAt)}` : "Waiting";
    const lockAttr = locked ? 'disabled title="Start or resume the batch first"' : "";
    const genericBtns = closed ? "" : st.status === "todo"
      ? `<button data-a="stepStart" data-id="${b.id}" data-k="${s.key}" class="${secondaryButtonClass}" ${lockAttr}>${icon("play")}Start ${esc(s.title)}</button>`
      : st.status === "active" ? `<button data-a="stepDone" data-id="${b.id}" data-k="${s.key}" class="${buttonClass}" ${lockAttr}>${icon("circle-check")}Mark ${esc(s.title)} complete</button>`
      : s.key === "weigh" ? "" : ["mix", "fill", "label", "qa"].includes(s.key) && st.status === "active" ? "" : `<button data-a="stepReopen" data-id="${b.id}" data-k="${s.key}" class="${secondaryButtonClass}" ${lockAttr}>${icon("undo-2")}Reopen</button>`;
    const qaExtra = "";
    const body = s.key === "weigh"
      ? `<p class="mb-4 text-sm text-stone-600">${esc(s.hint)}</p>${st.status === "todo" ? `<div class="flex flex-wrap gap-2">${genericBtns}</div>` : weighModule(b, st, locked || closed)}`
      : s.key === "mix"

/* ------ Lab requisition (8.5 × 11) ------ */
function requisitionDoc(b) {

  const f = by(S.formulas, b.formulaId); const lab = by(S.labs, q.sub.labId);
  const bud = b.snapshot?.budDate ?? (b.made && f.bud ? addDays(b.made, f.bud) : null);
  const total = q.sub.tests.reduce((a, t) => a + t.samples, 0);
  const container = packagingLines(S, b).map((l) => by(S.components, l.compId).name)[0] ?? f.form;
  const kv = (k, v) => `<div><div class="text-[9px] font-semibold uppercase tracking-wide text-stone-500">${k}</div><div class="text-[12px] text-stone-900">${v}</div></div>`;
  const line = (label) => `<div><div class="h-7 border-b border-stone-500"></div><div class="mt-1 flex justify-between text-[9px] uppercase tracking-wide text-stone-500"><span>${label}</span><span>Date / time</span></div></div>`;
  return `<div class="overflow-x-auto pb-2"><article class="mx-auto w-[816px] max-w-none bg-white p-12 text-stone-900 shadow-md ring-1 ring-stone-200" style="aspect-ratio: 8.5 / 11">
      <header class="flex items-start justify-between border-b-2 border-stone-900 pb-4">
        <div><div class="text-[15px] font-bold uppercase tracking-wide">${esc(S.org.name)}</div><div class="text-[11px] text-stone-600">${esc(S.org.address)} · ${esc(S.org.phone)}</div></div>
        <div class="text-right"><div class="text-[18px] font-semibold">Laboratory Test Request</div><div class="font-mono text-[12px]">${esc(q.sub.id)}</div><div class="text-[11px] text-stone-600">${fd(q.sub.at.slice(0, 10))}</div></div>
      </header>
      <section class="grid grid-cols-2 gap-8 border-b border-stone-300 py-4">
        <div class="grid gap-2"><div class="text-[10px] font-bold uppercase tracking-wider text-stone-700">Submitted by</div>${kv("Pharmacy", esc(S.org.name))}${kv("Contact", `${esc(person(q.sub.by).name)} · ${esc(person(q.sub.by).email)}`)}${kv("Phone", esc(S.org.phone))}</div>
        <div class="grid gap-2"><div class="text-[10px] font-bold uppercase tracking-wider text-stone-700">Laboratory</div>${kv("Lab", esc(lab.name))}${kv("Address", `${esc(lab.address)}, ${esc(lab.city)}`)}${kv("Client account", esc(lab.account))}</div>
      </section>
      <section class="border-b border-stone-300 py-4"><div class="mb-2 text-[10px] font-bold uppercase tracking-wider text-stone-700">Product</div>
        <div class="grid grid-cols-4 gap-x-6 gap-y-3">${kv("Product", esc(f.name))}${kv("Lot", `<span class="font-mono font-semibold">${esc(b.lot)}</span>`)}${kv("Dosage form", `${esc(f.form)} · ${fq(f.dispQty)} ${esc(f.dispUnit)}`)}${kv("Sterility", esc(sterLabel(f.sterility)))}
          ${kv("Compounded", fd(b.made))}${kv("Beyond use date", fd(bud))}${kv("Batch size", `${fq(b.planned)} ${esc(f.unit)}`)}${kv("Units in batch", b.run.fill?.locked ? b.run.fill.good : "—")}</div></section>
      <section class="py-4"><div class="mb-2 text-[10px] font-bold uppercase tracking-wider text-stone-700">Tests requested</div>
        <table class="w-full text-[12px]"><thead><tr class="border-b border-stone-400 text-left text-[9px] uppercase tracking-wide text-stone-500"><th class="py-1.5">Test</th><th class="py-1.5">Container</th><th class="py-1.5 text-right">Samples</th></tr></thead>
        <tbody>${q.sub.tests.map((t) => `<tr class="border-b border-stone-200"><td class="py-1.5">${esc(t.name)}</td><td class="py-1.5 text-stone-600">${esc(container)}</td><td class="py-1.5 text-right font-mono">${t.samples}</td></tr>`).join("")}
          <tr><td class="py-1.5 font-semibold" colspan="2">Total samples enclosed</td><td class="py-1.5 text-right font-mono font-semibold">${total}</td></tr></tbody></table>
        <div class="mt-3 text-[11px] text-stone-600"><b>Storage:</b> ${esc(f.labelText || "—")}</div></section>
      <section class="border-t border-stone-300 pt-4"><div class="mb-3 text-[10px] font-bold uppercase tracking-wider text-stone-700">Chain of custody</div>
        <div class="grid grid-cols-2 gap-8">${line("Relinquished by")}${line("Received by (lab)")}</div>
        <div class="mt-4 text-[11px] text-stone-600">Carrier / tracking: <span class="font-mono text-stone-900">${q.sub.tracking ? `${esc(q.sub.carrier)} ${esc(q.sub.tracking)}` : "______________________________"}</span></div></section>

  };
  const body = list.length ? `<table class="${tableClass} min-w-[1040px]"><thead class="${theadClass}"><tr><th class="${thClass}">Component</th><th class="${thClass}">Type</th><th class="${thClass}">Manufacturer</th><th class="${thClass}">NDC/SKU</th><th class="${thClass}">Package</th><th class="${thClass}">Package cost</th><th class="${thClass}">Unit cost</th><th class="${thClass} text-right">Actions</th></tr></thead>

      ${i === 0 ? `<td rowspan="${span}" class="${tdClass} ${sp}"><div class="flex items-center gap-2"><span class="font-medium text-stone-900">${esc(c.name)}</span>${c.isApi ? Badge("API", "violet", "px-1.5 py-0 text-[10px]", false, "Counted in the API usage report") : ""}</div>${c.desc ? `<div class="mt-0.5 max-w-[28rem] text-xs text-stone-500">${esc(c.desc)}</div>` : ""}</td>
        <td rowspan="${span}" class="${tdClass} ${sp}"><select data-a-change="compSetType" data-id="${c.id}" class="h-7 rounded-md border border-stone-200 bg-white pl-2 text-xs text-stone-700" aria-label="Type of ${esc(c.name)}">${S.types.map((x) => opt(x.id, x.title, c.type)).join("")}</select></td>` : ""}
      <td class="${tdClass}"><div class="flex items-center gap-1.5"><span class="whitespace-nowrap text-stone-700">${esc(m.name)}</span>${span > 1 && m.preferred ? Badge("Preferred", "blue", "px-1.5 py-0 text-[10px]", false, "Prices master formulas and any line that does not name a manufacturer") : ""}${m.version > 1 ? `<span class="rounded bg-stone-100 px-1 font-mono text-[10px] text-stone-500" title="Price history">v${m.version}</span>` : ""}</div></td>
      <td class="${tdClass} font-mono text-stone-600">${esc(m.ndc || "—")}</td>
      <td class="${tdClass} font-mono text-stone-600">${fq(m.pkgQty)} ${esc(m.pkgUnit)}</td>
      <td class="${tdClass} font-mono text-stone-600">${money(m.pkgCost)}</td>
      <td class="${tdClass} font-mono text-stone-900">${money(m.unitCost)}<span class="text-stone-400"> / ${esc(c.unit)}</span></td>
      ${i === 0 ? `<td rowspan="${span}" class="${tdClass} ${sp} text-right"><div class="inline-flex items-center justify-end gap-2"><button data-a="editComponent" data-id="${c.id}" class="${iconButtonClass}" title="Edit">${icon("pencil", "h-3.5 w-3.5")}</button><button data-a="deleteComponent" data-id="${c.id}" class="${dangerIconButtonClass}" title="Delete">${icon("trash-2", "h-3.5 w-3.5")}</button></div></td>` : ""}
    </tr>`).join("")}</tbody>`; }).join("")}</table>` : Empty("package", "No components yet", "Add a library component to start building formula and batch costs.");
  return `${PageHeader(type ? type.title : "Component Library", type ? type.desc : "Every component sits under exactly one type. Labor and testing stay in their own libraries.",
      `<button data-a="addComponent" data-type="${t}" class="${buttonClass}">${icon("plus")}Add ${type ? type.singular : "Component"}</button>
      ${type ? "" : `<button data-a="toast" data-msg="Export downloads a CSV of every component in the live app." class="${secondaryButtonClass}">${icon("download")}Export CSV</button><button data-a="toast" data-msg="Import reads a CSV in the same format as the export." class="${secondaryButtonClass}">${icon("upload")}Import CSV</button>`}`)}
    <div class="mb-5"><nav aria-label="Component types" class="flex flex-wrap gap-2">${pill("", "All components", S.components.length)}${S.types.map((x) => pill(x.id, x.title, S.components.filter((c) => c.type === x.id).length, x.hint)).join("")}</nav></div>
    ${TableCard(type ? type.title : "All components", body)}
    <div class="mt-5 flex flex-wrap items-center justify-between gap-3"><div class="flex flex-wrap items-center gap-1.5"><span class="mr-1 text-xs font-medium uppercase tracking-wide text-stone-400">Units</span>${S.units.map((u) => `<span class="rounded-md border border-stone-200 bg-white px-2 py-0.5 text-xs font-medium text-stone-600">${esc(u.abbr)}</span>`).join("")}</div>
      <button data-a="addUnit" class="${secondaryButtonClass}">Add Unit</button></div>`;

pages.schedule = () => {
  const days = Array.from({ length: 7 }, (_, i) => addDays(UI.week, i));
  const items = S.batches.filter((b) => b.slot && days.includes(b.slot.date));
  const label = `${parseD(days[0]).toLocaleDateString("en-US", { month: "short", day: "numeric" })} – ${parseD(days[6]).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}`;

    <ul class="mt-2 flex flex-wrap gap-1">${b.slot.location ? chip("map-pin", b.slot.location, "Location") : ""}${b.slot.room ? chip("door-open", b.slot.room, "Room") : ""}${b.slot.hood ? chip("air-vent", b.slot.hood, "Hood") : ""}</ul>
    <div class="mt-2 flex flex-wrap items-center gap-x-2 gap-y-1"><div class="flex -space-x-1.5">${b.slot.people.map((pid) => { const p = by(S.team, pid); return p ? `<span title="${esc(p.email)}" class="flex h-6 w-6 items-center justify-center rounded-full bg-stone-200 text-[10px] font-semibold text-stone-600 ring-2 ring-white">${p.initials}</span>` : ""; }).join("")}</div>

/* ------ Reports ------ */
function inRange(d, from, to) { return d && d >= from && d <= to; }

  const r = UI.report;
  const list = S.batches.filter((b) => (r.client === "all" || (r.client === "none" ? !b.clientId : b.clientId === r.client)) && inRange(b.made, r.from, r.to) && (r.status === "all" || b.status === "complete"));
  let total = 0, units = 0;
  const rows = list.map((b) => {
    const f = by(S.formulas, b.formulaId), c = batchCost(S, b), u = unitCost(b, c);

    const bud = b.snapshot?.budDate ?? (b.made && f.bud ? addDays(b.made, f.bud) : null);

      <td class="${tdClass} whitespace-nowrap font-mono">${fq(b.planned)} ${esc(f.unit)}</td><td class="${tdClass} font-mono ${b.actualYield == null ? "text-stone-400" : ""}">${b.actualYield ?? "—"}</td>
      <td class="${tdClass} whitespace-nowrap ${b.snapshot ? "" : "text-stone-400"}" ${b.snapshot ? "" : 'title="Projected from the current MFR; assigned at completion"'}>${fd(bud)}</td>
      <td class="${tdClass} whitespace-nowrap text-right font-mono font-semibold text-stone-900">${money(c.total)}${c.source === "live" ? '<span class="ml-1 font-sans text-[10px] font-medium uppercase text-amber-600" title="Provisional: current library prices">live</span>' : ""}</td>

  return `${PageHeader("Batch affiliate report", "One row per batch, filtered by client and manufacture date. Completed batches show their frozen cost and assigned BUD; draft and in-progress batches show live, provisional figures.")}
    <div class="mb-5 flex flex-wrap items-end gap-3 rounded-xl border border-stone-200/80 bg-white p-4 shadow-sm">
      <div class="w-56">${Field("Client / affiliate", `<select id="rf-client" data-a-change="report" data-k="client" class="${inputClass}">${opt("all", "All clients", r.client)}${opt("none", "Unassigned", r.client)}${S.clients.map((k) => opt(k.id, k.name, r.client)).join("")}</select>`)}</div>
      <div class="w-40">${Field("From", `<input id="rf-from" data-a-change="report" data-k="from" type="date" class="${inputClass}" value="${r.from}">`)}</div>
      <div class="w-40">${Field("To", `<input id="rf-to" data-a-change="report" data-k="to" type="date" class="${inputClass}" value="${r.to}">`)}</div>
      <div class="w-44">${Field("Status", `<select id="rf-status" data-a-change="report" data-k="status" class="${inputClass}">${opt("all", "All batches", r.status)}${opt("complete", "Completed only", r.status)}</select>`)}</div>
      <div class="flex flex-wrap gap-1.5 pb-0.5">${[["Last 30 days", 30], ["Last 90 days", 90], ["Year to date", "ytd"]].map(([l, v]) => `<button data-a="preset" data-scope="report" data-v="${v}" class="${smallButtonClass}">${l}</button>`).join("")}</div>
    </div>
    <div class="mb-5 grid gap-4 sm:grid-cols-3">${StatCard("Batches", list.length, "clipboard-list")}${StatCard("Total batch cost", money(total), "receipt")}${StatCard("Combined cost per unit", units ? money(total / units) : "—", "calculator", "Total cost ÷ actual (or estimated) units")}</div>
    ${TableCard("Batches", list.length ? `<table class="${tableClass} min-w-[1060px]"><thead class="${theadClass}"><tr><th class="${thClass}">Lot #</th><th class="${thClass}">Formula</th><th class="${thClass}">Client</th><th class="${thClass}">Status</th><th class="${thClass}">Made</th><th class="${thClass}">Planned</th><th class="${thClass}">Yield</th><th class="${thClass}">BUD</th><th class="${thClass} text-right">Batch cost</th><th class="${thClass} text-right">Unit cost</th></tr></thead><tbody class="${tbodyClass}">${rows}</tbody></table>`
      : Empty("chart-column", "No batches in this range", "Widen the date range or choose another client."))}`;
};

pages.usage = () => {
  const r = UI.usage;
  const list = S.batches.filter((b) => inRange(b.made, r.from, r.to) && (r.status === "all" || b.status === "complete"));
  const map = new Map();
  list.forEach((b) => b.lines.forEach((l) => {
    const comp = by(S.components, l.compId); if (!comp) return;
    if (r.type !== "all" && comp.type !== r.type) return;
    const d = parseD(b.made);
    const period = r.group === "month" ? d.toLocaleDateString("en-US", { month: "short", year: "numeric" }) : "Week of " + parseD(startOfWeek(b.made)).toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const sortKey = r.group === "month" ? b.made.slice(0, 7) : startOfWeek(b.made);
    const k = comp.id + "|" + sortKey;
    const row = map.get(k) || { comp, period, sortKey, batches: new Set(), total: 0, frozen: 0, prov: 0 };
    row.batches.add(b.id); row.total += Number(l.qty);
    if (b.status === "complete") row.frozen += Number(l.qty); else row.prov += Number(l.qty);
    map.set(k, row);
  }));
  const rows = [...map.values()].sort((a, b) => b.sortKey.localeCompare(a.sortKey) || a.comp.name.localeCompare(b.comp.name));
  const prov = rows.filter((x) => x.prov > 0).length;
  return `${PageHeader("Component usage", "Quantities recorded on each batch's own recipe, by component and manufacture date. Reorder planning input, not stock on hand.")}
    <div class="mb-5 flex flex-wrap items-end gap-3 rounded-xl border border-stone-200/80 bg-white p-4 shadow-sm">
      <div class="w-40">${Field("From", `<input id="uf-from" data-a-change="usage" data-k="from" type="date" class="${inputClass}" value="${r.from}">`)}</div>
      <div class="w-40">${Field("To", `<input id="uf-to" data-a-change="usage" data-k="to" type="date" class="${inputClass}" value="${r.to}">`)}</div>
      <div class="w-44">${Field("Batch status", `<select id="uf-status" data-a-change="usage" data-k="status" class="${inputClass}">${opt("complete", "Completed only", r.status)}${opt("all", "All", r.status)}</select>`)}</div>
      <div class="w-44">${Field("Type", `<select id="uf-type" data-a-change="usage" data-k="type" class="${inputClass}">${opt("all", "All types", r.type)}${S.types.map((t) => opt(t.id, t.title, r.type)).join("")}</select>`)}</div>
      <div class="w-36">${Field("Group by", `<select id="uf-group" data-a-change="usage" data-k="group" class="${inputClass}">${opt("month", "Month", r.group)}${opt("week", "Week", r.group)}</select>`)}</div>
    </div>
    <div class="mb-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">${StatCard("Batches counted", list.length, "clipboard-list")}${StatCard("Components used", new Set(rows.map((x) => x.comp.id)).size, "package")}${StatCard("Usage rows", rows.length, "activity")}${StatCard("Provisional rows", prov, "circle-dot", prov ? "Include draft or in-progress batches" : "")}</div>
    ${TableCard("Usage by period", rows.length ? `<table class="${tableClass} min-w-[860px]"><thead class="${theadClass}"><tr><th class="${thClass}">Component</th><th class="${thClass}">Type</th><th class="${thClass}">Period</th><th class="${thClass}">Batches</th><th class="${thClass} text-right">Total quantity</th><th class="${thClass} text-right">Frozen</th><th class="${thClass} text-right">Provisional</th></tr></thead><tbody class="${tbodyClass}">
      ${rows.map((x) => `<tr class="${trClass}"><td class="${tdClass}"><span class="font-medium text-stone-900">${esc(x.comp.name)}</span>${x.comp.isApi ? " " + Badge("API", "violet", "px-1.5 py-0 text-[10px]") : ""}</td><td class="${tdClass} text-stone-600">${esc(by(S.types, x.comp.type).title)}</td><td class="${tdClass} whitespace-nowrap text-stone-600">${esc(x.period)}</td><td class="${tdClass} font-mono">${x.batches.size}</td><td class="${tdClass} text-right font-mono font-semibold text-stone-900">${fq(+x.total.toFixed(3))} ${esc(x.comp.unit)}</td><td class="${tdClass} text-right font-mono text-stone-600">${x.frozen ? fq(+x.frozen.toFixed(3)) : "—"}</td><td class="${tdClass} text-right font-mono ${x.prov ? "text-amber-700" : "text-stone-400"}">${x.prov ? fq(+x.prov.toFixed(3)) : "—"}</td></tr>`).join("")}
    </tbody></table>` : Empty("activity", "No recorded usage in this range", "Widen the date range, or set Batch status to All to include draft and in-progress batches while testing."))}`;
};

pages.quote = () => {
  const q = UI.quote;
  const f = by(S.formulas, q.formulaId) || S.formulas[0];
  const fc = formulaCost(S, f);
  const made = S.batches.filter((b) => b.formulaId === f.id && (q.which === "all" ? true : b.status === "complete"));
  const counted = made.filter((b) => b.actualYield > 0);
  const tot = counted.reduce((s, b) => s + batchCost(S, b).total, 0), units = counted.reduce((s, b) => s + b.actualYield, 0);
  const latest = counted.slice().sort((a, b) => b.made.localeCompare(a.made))[0];
  const latestC = latest ? batchCost(S, latest) : null;
  return `${PageHeader("Quote engine", "What a product has cost to make, per finished unit, from the batches that made it. This is the cost basis for a quote. Search a formula and pick the strength and size.")}
    <div class="mb-5 flex flex-wrap items-end gap-3 rounded-xl border border-stone-200/80 bg-white p-4 shadow-sm">
      <div class="min-w-0 flex-1 basis-72">${Field("Product", `<select id="q-formula" data-a-change="quote" data-k="formulaId" class="${inputClass}">${S.formulas.map((x) => opt(x.id, x.name, f.id)).join("")}</select>`)}</div>
      <div class="w-60">${Field("Which batches count", `<select id="q-which" data-a-change="quote" data-k="which" class="${inputClass}">${opt("complete", "Completed batches only", q.which)}${opt("all", "Include draft and in progress", q.which)}</select>`)}</div>
    </div>
    <div class="mb-1 text-sm text-stone-500"><span class="font-medium text-stone-800">${esc(f.name)}</span> · ${esc(f.form)} · ${fq(f.dispQty)} ${esc(f.dispUnit)} per unit</div>
    <div class="mb-5 mt-3 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      ${StatCard("Cost per unit", units ? money(tot / units) : money(fc.perUnit), "calculator", units ? `Weighted across ${counted.length} batches` : "From the master formula at current library prices; no batch has a usable actual yield yet")}
      ${StatCard("Latest batch", latest ? money(latestC.total / latest.actualYield) : "—", "clipboard-list", latest ? `${latest.lot} · ${fd(latest.made)}` : "No batch history yet")}
      ${StatCard("Batches", counted.length, "layers", `${made.length - counted.length} without an actual yield`)}
      ${StatCard("Master formula today", money(fc.perUnit), "flask-conical", "Current recipe and library prices")}
    </div>
    ${TableCard("Recently made", counted.length ? `<table class="${tableClass} min-w-[720px]"><thead class="${theadClass}"><tr><th class="${thClass}">Lot #</th><th class="${thClass}">Made</th><th class="${thClass}">Status</th><th class="${thClass}">Actual yield</th><th class="${thClass} text-right">Batch cost</th><th class="${thClass} text-right">Cost per unit</th></tr></thead><tbody class="${tbodyClass}">
      ${counted.map((b) => { const c = batchCost(S, b); return `<tr class="${trClass}"><td class="${tdClass} font-mono font-semibold"><button data-a="nav" data-to="batch" data-id="${b.id}" class="hover:text-brand hover:underline">${esc(b.lot)}</button></td><td class="${tdClass}">${fd(b.made)}</td><td class="${tdClass}">${StatusBadge(b.status, "px-2 py-0 text-[11px]")}</td><td class="${tdClass} font-mono">${b.actualYield} units</td><td class="${tdClass} text-right font-mono">${money(c.total)}</td><td class="${tdClass} text-right font-mono font-semibold text-stone-900">${money(c.total / b.actualYield)}</td></tr>`; }).join("")}
    </tbody></table>` : Empty("calculator", "No batch history yet", "Complete a batch with an actual yield to quote from real production cost."))}`;
};

pages.analytics = () => {
  const months = ["2026-05", "2026-06", "2026-07", "2026-08", "2026-09", "2026-10"];
  const data = months.map((m) => {
    const bs = S.batches.filter((b) => b.made && b.made.startsWith(m));
    const sum = (pred, fn) => bs.filter(pred).reduce((s, b) => s + fn(b), 0);
    const done = (b) => b.status === "complete", prov = (b) => b.status !== "complete";
    const cost = (b) => batchCost(S, b).total;
    const units = (b) => b.actualYield ?? batchCost(S, b).finishedUnits;
    return { m, label: parseD(m + "-01").toLocaleDateString("en-US", { month: "short" }),
      batches: [bs.filter(done).length, bs.filter(prov).length], cost: [sum(done, cost), sum(prov, cost)], units: [sum(done, units), sum(prov, units)] };
  });
  const chart = (title, key, fmt) => {
    const max = Math.max(1, ...data.map((d) => d[key][0] + d[key][1]));
    const ticks = [0, 0.5, 1].map((t) => max * t);
    return `<section class="rounded-xl border border-stone-200/80 bg-white p-4 shadow-sm sm:p-5">
      <div class="mb-4 flex items-center justify-between gap-3"><h2 class="text-xs font-semibold uppercase tracking-wider text-stone-500">${title}</h2>
        <div class="flex items-center gap-3 text-xs text-stone-500"><span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-brand"></span>Complete</span><span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-sm bg-amber-400"></span>Provisional</span></div></div>
      <div class="relative flex gap-3">
        <div class="flex h-44 w-12 flex-col-reverse justify-between text-right font-mono text-[10px] text-stone-400">${ticks.map((t) => `<span>${fmt(t)}</span>`).join("")}</div>
        <div class="relative flex h-44 flex-1 items-end gap-2 border-b border-l border-stone-200 pl-2 sm:gap-4">
          <div class="pointer-events-none absolute inset-x-0 top-1/2 border-t border-dashed border-stone-100"></div><div class="pointer-events-none absolute inset-x-0 top-0 border-t border-dashed border-stone-100"></div>
          ${data.map((d) => { const [a, b] = d[key]; const tot = a + b; return `<div class="relative flex h-full flex-1 flex-col justify-end" title="${d.label}: ${fmt(tot)}">
            <span class="mb-1 text-center font-mono text-[10px] font-medium text-stone-600">${tot ? fmt(tot) : ""}</span>
            ${b ? `<div class="w-full rounded-t-sm bg-amber-400" style="height:${(b / max) * 100 * 0.86}%"></div>` : ""}
            <div class="w-full ${b ? "" : "rounded-t-sm"} bg-brand" style="height:${(a / max) * 100 * 0.86}%"></div></div>`; }).join("")}
        </div></div>
      <div class="ml-[3.75rem] mt-1.5 flex gap-2 pl-2 sm:gap-4">${data.map((d) => `<span class="flex-1 text-center text-[11px] text-stone-500">${d.label}</span>`).join("")}</div></section>`;
  };
  const cnt = (v) => String(Math.round(v));
  return `${PageHeader("Analytics", "Batches made, total cost, and finished units by month of manufacture. Completed batches use frozen costs; draft and in-progress batches are provisional.")}
    <div class="grid gap-4 lg:grid-cols-2">${chart("Batches made", "batches", cnt)}${chart("Total batch cost", "cost", (v) => (v ? moneyCompact(v) : "$0"))}${chart("Finished units", "units", cnt)}
    ${Section("Cost per unit by formula", `<div class="grid gap-3">${S.formulas.map((f) => { const bs = S.batches.filter((b) => b.formulaId === f.id && b.status === "complete" && b.actualYield); const t = bs.reduce((s, b) => s + batchCost(S, b).total, 0), u = bs.reduce((s, b) => s + b.actualYield, 0); return `<div class="flex items-center justify-between gap-3 text-sm"><span class="min-w-0 truncate text-stone-700">${esc(f.name)}</span><span class="flex-shrink-0 font-mono ${u ? "font-semibold text-stone-900" : "text-stone-400"}">${u ? money(t / u) : "None made"}</span></div>`; }).join("")}</div>`)}</div>`;
};

  return `${PageHeader("Settings", "Your account, your team, and how this pharmacy is set up.")}

/* ------------------------------ modals ------------------------------ */
function Modal(title, description, body, wide = false) {
  return `<div class="modal fixed inset-0 z-50 flex items-end justify-center sm:items-center" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="absolute inset-0 bg-stone-900/40 animate-fade-in" data-a="closeModal"></div>
    <div class="relative max-h-[90vh] w-full ${wide ? "max-w-2xl" : "max-w-lg"} overflow-y-auto rounded-t-2xl bg-white shadow-xl animate-pop sm:m-4 sm:rounded-2xl" style="padding-bottom: env(safe-area-inset-bottom, 0px)">
      <div class="flex items-start justify-between gap-4 border-b border-stone-100 px-5 py-4">
        <div><h2 class="text-base font-semibold text-stone-900">${esc(title)}</h2>${description ? `<p class="mt-1 text-sm text-stone-500">${esc(description)}</p>` : ""}</div>
        <button data-a="closeModal" class="flex h-8 w-8 flex-shrink-0 items-center justify-center rounded-lg text-stone-400 transition hover:bg-stone-100 hover:text-stone-900" aria-label="Close">${icon("x")}</button>
      </div>
      <div class="p-5">${body}</div>
    </div></div>`;
}
